name: serbtracker_manager
description: "Serbtracker Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  app_links: ^7.0.0
  firebase_analytics: ^12.1.3
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8
  firebase_messaging: ^16.1.2
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.4
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  shared_preferences_android: ^2.4.21
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
